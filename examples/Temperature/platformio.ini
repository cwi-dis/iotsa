; PlatformIO Project Configuration File
; Generated by extras/python/gen_build_matrix.py -- do not hand-edit,
; regenerate instead:
;   python3 extras/python/gen_build_matrix.py --format=standalone-ini \
;     --dir=examples/Temperature -o examples/Temperature/platformio.ini
; To pin this example against a specific published iotsa branch/tag
; instead of the local checkout, add an iotsa-config.json here:
;   {"iotsa": "https://github.com/cwi-dis/iotsa.git#develop"}
;
[platformio]
src_dir = .
default_envs = iotsa_v4

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps = symlink://../..
monitor_speed = 115200

[env:iotsa_v4]
extends = common
platform = espressif8266@4.0
board_build.filesystem = littlefs
board = nodemcuv2
lib_deps = 
    ${common.lib_deps}
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

[env:esp32thing]
extends = common
platform = espressif32@7.1.3
board_build.filesystem = littlefs
board = esp32thing
build_flags = -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
board_build.partitions = min_spiffs.csv
lib_deps = 
    ${common.lib_deps}
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

