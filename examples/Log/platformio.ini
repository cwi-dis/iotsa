; PlatformIO Project Configuration File
; Generated by extras/python/gen_build_matrix.py -- do not hand-edit,
; regenerate instead:
;   python3 extras/python/gen_build_matrix.py --format=standalone-ini \
;     --dir=examples/Log -o examples/Log/platformio.ini
; To pin this example against a specific published iotsa branch/tag
; instead of the local checkout, add an iotsa-config.json here:
;   {"iotsa": "https://github.com/cwi-dis/iotsa.git#develop"}
;
[platformio]
src_dir = .
default_envs = iotsa_v4

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps = symlink://../..
monitor_speed = 115200

[env:iotsa_v4]
extends = common
platform = espressif8266
board = nodemcuv2

[env:esp32thing]
extends = common
platform = espressif32
board = esp32thing
board_build.partitions = min_spiffs.csv

[env:esp32c3devkit]
extends = common
platform = espressif32
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv

[env:esp32s3supermini]
extends = common
platform = espressif32
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs.csv

