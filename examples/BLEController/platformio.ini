; PlatformIO Project Configuration File
; Generated by extras/python/gen_build_matrix.py -- do not hand-edit,
; regenerate instead:
;   python3 extras/python/gen_build_matrix.py --format=standalone-ini \
;     --dir=examples/BLEController -o examples/BLEController/platformio.ini
; To pin this example against a specific published iotsa branch/tag
; instead of the local checkout, add an iotsa-config.json here:
;   {"iotsa": "https://github.com/cwi-dis/iotsa.git#develop"}
;
[platformio]
src_dir = .
default_envs = esp32c3supermini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps = symlink://../..
monitor_speed = 115200

[env:esp32c3supermini]
extends = common
platform = espressif32@7.1.3
board_build.filesystem = littlefs
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
build_flags = -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192 -DESP32C3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DIOTSA_SERIAL_SPEED=460800 -DIOTSA_DELAY_ON_BOOT=3 -DIOTSA_WITH_BLE
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
lib_deps = 
    ${common.lib_deps}
    h2zero/NimBLE-Arduino

[env:esp32c3devkit]
extends = common
platform = espressif32@7.1.3
board_build.filesystem = littlefs
board = esp32-c3-devkitm-1
build_flags = -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192 -DESP32C3 -DIOTSA_PIN_NEOPIXEL=8 -DIOTSA_WITH_BLE
board_build.partitions = min_spiffs.csv
lib_deps = 
    ${common.lib_deps}
    h2zero/NimBLE-Arduino

[env:esp32thing]
extends = common
platform = espressif32@7.1.3
board_build.filesystem = littlefs
board = esp32thing
build_flags = -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192 -DIOTSA_WITH_BLE
board_build.partitions = min_spiffs.csv
lib_deps = 
    ${common.lib_deps}
    h2zero/NimBLE-Arduino

[env:esp32s3supermini]
extends = common
platform = espressif32@7.1.3
board_build.filesystem = littlefs
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
build_flags = -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192 -DESP32S3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DIOTSA_SERIAL_SPEED=460800 -DIOTSA_DELAY_ON_BOOT=3 -DIOTSA_PIN_NEOPIXEL=48 -DIOTSA_WITH_BLE
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
lib_deps = 
    ${common.lib_deps}
    h2zero/NimBLE-Arduino

[env:lolin32-debug]
extends = common
platform = espressif32@7.1.3
board_build.filesystem = littlefs
board = lolin32_lite
build_flags = -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192 -DIOTSA_WITH_BLE -DIOTSA_DEBUG_BLE_PRINT_ALL_CLIENTS -DCONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT
board_build.partitions = min_spiffs.csv
lib_deps = 
    ${common.lib_deps}
    h2zero/NimBLE-Arduino

