; PlatformIO Project Configuration File
; Generated by extras/python/gen_build_matrix.py -- do not hand-edit.
;
[platformio]
src_dir = .
default_envs = esp32thing

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps = https://github.com/cwi-dis/iotsa.git#develop
monitor_speed = 115200

[env:esp32thing]
extends = common
platform = espressif32
board = esp32thing
build_flags = -DIOTSA_WITH_BLE
board_build.partitions = min_spiffs.csv

[env:esp32c3devkit]
extends = common
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = -DIOTSA_WITH_BLE
board_build.partitions = min_spiffs.csv

