; PlatformIO Project Configuration File
; Generated by extras/python/gen_build_matrix.py -- do not hand-edit,
; regenerate instead:
;   python3 extras/python/gen_build_matrix.py --format=standalone-ini \
;     --dir=examples/Led -o examples/Led/platformio.ini
; To pin this example against a specific published iotsa branch/tag
; instead of the local checkout, add an iotsa-config.json here:
;   {"iotsa": "https://github.com/cwi-dis/iotsa.git#develop"}
;
[platformio]
src_dir = .
default_envs = iotsa_v4

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps = symlink://../..
monitor_speed = 115200

[env:iotsa_v4]
extends = common
platform = espressif8266@4.0
board_build.filesystem = littlefs
board = nodemcuv2
build_flags = -DIOTSA_PIN_LED=15 -DIOTSA_LED_NEOPIXEL

[env:esp32thing]
extends = common
platform = espressif32@7.1.3
board_build.filesystem = littlefs
board = esp32thing
build_flags = -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
board_build.partitions = min_spiffs.csv

[env:esp32c3devkit]
extends = common
platform = espressif32@7.1.3
board_build.filesystem = littlefs
board = esp32-c3-devkitm-1
build_flags = -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192 -DESP32C3 -DIOTSA_PIN_LED=8 -DIOTSA_LED_NEOPIXEL
board_build.partitions = min_spiffs.csv

[env:esp32s3supermini]
extends = common
platform = espressif32@7.1.3
board_build.filesystem = littlefs
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
build_flags = -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192 -DESP32S3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DIOTSA_SERIAL_SPEED=460800 -DIOTSA_DELAY_ON_BOOT=3 -DIOTSA_PIN_LED=48 -DIOTSA_LED_NEOPIXEL
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB

[env:iotsa_v4-all]
