; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
default_envs =
    esp32thing-example-Led
; Per-example/test/sandbox [env:...] sections are generated from
; examples/*/iotsa-build.json, tests/*/iotsa-build.json, and
; sandbox/*/iotsa-build.json -- do not hand-edit generated_envs.ini, regenerate it:
;   python3 extras/python/gen_build_matrix.py --format=platformio-ini -o generated_envs.ini
extra_configs =
    generated_envs.ini
;
; common options for all variants of iotsa
;
; lib_deps below must mirror library.json's "dependencies": that manifest is what
; PlatformIO consults when *iotsa is a dependency of something else* (pio ci --lib=".",
; or a downstream app's platformio.ini). It is NOT consulted when building this repo's
; own examples/tests as their own project (as this platformio.ini does) -- verified
; empirically while rationalising this file for #156: emptying lib_deps here breaks a
; self-build even though library.json still lists the same dependency.
;
[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
; Empty here so every board section has a resolvable build_flags option --
; gen_build_matrix.py interpolates ${board.build_flags} when merging in an
; example's own flags, and that interpolation errors on an undefined option.
build_flags =
lib_deps =
    Adafruit NeoPixel
    ArduinoJson@7.4.3
    jackjansen/cmArduinoJWT
    hirotakaster/CoAP simple library
    caligari/Ds1302
monitor_speed = 115200
extra_scripts = 
    pre:platformio_pre_script.py
;
; Debug options, copy or include with ${section.option} syntax
;
[use_debug_prints]
build_type = debug
monitor_filters = esp32_exception_decoder
; Very verbose prints from the core...
; build_flags =  -DCORE_DEBUG_LEVEL=6
; https debugging
; build_flags = -DHTTPS_LOGLEVEL=4
; NimBLE debugging
; build_flags = -DCONFIG_NIMBLE_CPP_LOG_LEVEL=4

[use_debugger]
debug_tool = minimodule
upload_protocol = minimodule

;
; per-processor options for variants of iotsa. Extends common options.
;

[esp8266]
extends = common
platform = espressif8266@4.0

[esp32_allvariants]
extends = common
platform = espressif32
lib_deps =
    ${common.lib_deps}
    jackjansen/esp32_idf5_https_server_compat
    h2zero/NimBLE-Arduino@^2.1.0
    madhephaestus/ESP32Encoder

lib_ignore = 
    ESP32 BLE Arduino

[esp32]
extends = esp32_allvariants
lib_deps = 
    ${esp32_allvariants.lib_deps}

[esp32c3]
extends = esp32_allvariants
# This is for esp32c3 boards with an external USB interface.
build_flags = -DESP32C3

[esp32c3jtag]
extends = esp32_allvariants
# This enables the builtin esp32c3 USB-Serial/JTAG peripheral to be used as Serial.
# IOTSA_DELAY_ON_BOOT gives the host time to open the CDC port before the first
# prints happen, so early boot output isn't lost -- needed by any native-USB
# board, not just esp32c3, hence it lives here rather than in the ESP32C3-only
# [esp32c3] (external-interface) section above.
build_flags = -DESP32C3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DIOTSA_SERIAL_SPEED=460800 -DIOTSA_DELAY_ON_BOOT=3

[esp32s3jtag]
extends = esp32_allvariants
# This enables the builtin esp32s3 USB-Serial/JTAG peripheral to be used as Serial.
# esp32s3otg (the alternative native USB-OTG/TinyUSB peripheral) is not defined yet.
# See esp32c3jtag above for why IOTSA_DELAY_ON_BOOT belongs here.
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DIOTSA_SERIAL_SPEED=460800 -DIOTSA_DELAY_ON_BOOT=3
;
; per-board options for variants of iotsa. Extends per-processor options.
;
[nodemcuv2]
extends = esp8266
board = nodemcuv2

[esp32thing]
extends = esp32
board = esp32thing

[esp32dev]
extends = esp32
board = esp32dev

[lolin32]
extends = esp32
board = lolin32
board_build.partitions = min_spiffs.csv

[pico32]
extends = esp32
board = pico32

[esp32c3devkit]
extends = esp32c3
board = esp32-c3-devkitm-1

[esp32c3lcd]
extends = esp32c3jtag
board = esp32-c3-devkitm-1
# board_build.flash_mode: dio
board_build.mcu = esp32c3
board_build.partitions = bare_minimum_2MB.csv
board_upload.flash_size = 2MB

[esp32c3supermini]
extends = esp32c3jtag
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB

[esp32s3supermini]
extends = esp32s3jtag
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB

[crowpanel128]
extends = esp32c3
board = esp32-c3-devkitm-1
