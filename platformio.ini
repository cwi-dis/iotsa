; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
default_envs =
    esp32thing-example-Led
; Per-example/test/sandbox [env:...] sections are generated from
; examples/*/iotsa-build.json, tests/*/iotsa-build.json, and
; sandbox/*/iotsa-build.json -- do not hand-edit generated_envs.ini, regenerate it:
;   python3 extras/python/gen_build_matrix.py --format=platformio-ini -o generated_envs.ini
extra_configs =
    generated_envs.ini
;
; common options for all variants of iotsa
;
; lib_deps below must mirror library.json's "dependencies": that manifest is what
; PlatformIO consults when *iotsa is a dependency of something else* (pio ci --lib=".",
; or a downstream app's platformio.ini). It is NOT consulted when building this repo's
; own examples/tests as their own project (as this platformio.ini does) -- verified
; empirically while rationalising this file for #156: emptying lib_deps here breaks a
; self-build even though library.json still lists the same dependency.
;
[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
; Empty here so every board section has a resolvable build_flags option --
; gen_build_matrix.py interpolates ${board.build_flags} when merging in an
; example's own flags, and that interpolation errors on an undefined option.
build_flags =
lib_deps =
    Adafruit NeoPixel
    ArduinoJson@7.4.3
    jackjansen/cmArduinoJWT
    hirotakaster/CoAP simple library
    caligari/Ds1302
monitor_speed = 115200
extra_scripts = 
    pre:platformio_pre_script.py
;
; Debug options, copy or include with ${section.option} syntax
;
[use_debug_prints]
build_type = debug
monitor_filters = esp32_exception_decoder
; Very verbose prints from the core...
; build_flags =  -DCORE_DEBUG_LEVEL=6
; https debugging
; build_flags = -DHTTPS_LOGLEVEL=4
; NimBLE debugging
; build_flags = -DCONFIG_NIMBLE_CPP_LOG_LEVEL=4

[use_debugger]
debug_tool = minimodule
upload_protocol = minimodule

;
; Layer 3 -- processor/USB-wiring traits (#222). Leading underscore: these are
; plumbing, never a valid iotsa-build.json "board" value on their own (no
; board=, no hardware facts like a neopixel pin). Extends common options.
;
[_esp8266]
extends = common
platform = espressif8266@4.0

[_esp32_allvariants]
extends = common
platform = espressif32
lib_deps =
    ${common.lib_deps}
    jackjansen/esp32_idf5_https_server_compat
    h2zero/NimBLE-Arduino@^2.1.0
    madhephaestus/ESP32Encoder

lib_ignore =
    ESP32 BLE Arduino

[_esp32c3_extusb]
extends = _esp32_allvariants
# For esp32c3 boards with an external USB-serial interface chip.
build_flags = -DESP32C3

[_esp32c3_nativeusb]
extends = _esp32_allvariants
# This enables the builtin esp32c3 USB-Serial/JTAG peripheral to be used as Serial.
# IOTSA_DELAY_ON_BOOT gives the host time to open the CDC port before the first
# prints happen, so early boot output isn't lost -- needed by any native-USB
# board, not just esp32c3, hence it lives here rather than in the ESP32C3-only
# [_esp32c3_extusb] (external-interface) trait above.
build_flags = -DESP32C3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DIOTSA_SERIAL_SPEED=460800 -DIOTSA_DELAY_ON_BOOT=3

[_esp32s3_nativeusb]
extends = _esp32_allvariants
# This enables the builtin esp32s3 USB-Serial/JTAG peripheral to be used as Serial.
# esp32s3otg (the alternative native USB-OTG/TinyUSB peripheral) is not defined yet.
# See _esp32c3_nativeusb above for why IOTSA_DELAY_ON_BOOT belongs here.
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DIOTSA_SERIAL_SPEED=460800 -DIOTSA_DELAY_ON_BOOT=3
;
; Layer 2 -- boards we actually use (#222). Bare names: no prefix, since this
; is the layer an iotsa-build.json "board" field names most often, and (the
; goal, still open) the layer worth sharing with iotsa-using repos. Each one
; extends a layer-3 trait and adds the hardware facts we know for the physical
; boards we own (pin wiring, flash size, partition scheme) -- see #222.
;
[iotsa_v4]
extends = _esp8266
board = nodemcuv2

[esp32thing]
extends = _esp32_allvariants
board = esp32thing

[esp32dev]
extends = _esp32_allvariants
board = esp32dev

[lolin32]
extends = _esp32_allvariants
board = lolin32
board_build.partitions = min_spiffs.csv

[pico32]
extends = _esp32_allvariants
board = pico32

[esp32c3devkit]
extends = _esp32c3_extusb
board = esp32-c3-devkitm-1

[esp32c3lcd]
extends = _esp32c3_nativeusb
board = esp32-c3-devkitm-1
# board_build.flash_mode: dio
board_build.mcu = esp32c3
board_build.partitions = bare_minimum_2MB.csv
board_upload.flash_size = 2MB

[esp32c3supermini]
extends = _esp32c3_nativeusb
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
# No onboard neopixel on this board, unlike esp32c3devkit.

[esp32s3supermini]
extends = _esp32s3_nativeusb
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB

[crowpanel128]
extends = _esp32c3_extusb
board = esp32-c3-devkitm-1
;
; Layer 1 -- role aliases (#222). "vanilla_" prefix: pure synonyms for
; "whichever concrete board is our current default for this chip family" --
; carry no facts of their own, just point at a layer-2 board. Repoint these,
; not every iotsa-build.json, if the default board for a family ever changes.
;
[vanilla_esp8266]
extends = iotsa_v4

[vanilla_esp32]
extends = esp32thing

[vanilla_esp32c3]
extends = esp32c3devkit

[vanilla_esp32s3]
extends = esp32s3supermini
