# Created this action based on information found in:
# - <https://docs.platformio.org/en/latest/integration/ci/github-actions.html>
# - <https://docs.github.com/en/free-pro-team@latest/actions/quickstart>
#
# The build matrix itself is not hand-maintained here: it is generated from
# examples/*/iotsa-build.json and tests/*/iotsa-build.json by
# extras/python/gen_build_matrix.py. See #156.
name: build-platformio
on:
  push:
    paths-ignore:
    - '.github/workflows/build-arduino.yml'
    - 'docs/**'
  pull_request:
  workflow_dispatch:
    inputs:
      iotsa_ref:
        description: 'iotsa branch, ref or sha'
        required: true
        detault: develop

jobs:
  #
  # Job#1 - Compute the build matrix from examples/*/iotsa-build.json and
  # tests/*/iotsa-build.json, and check the committed generated_envs.ini
  # (used for local dev builds) is still in sync with the same source data.
  #
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2

    - name: Generate matrix
      id: gen
      run: |
        MATRIX=$(python3 extras/python/gen_build_matrix.py --format=github-matrix --backend=platformio)
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

    - name: Check generated_envs.ini is up to date
      run: |
        python3 extras/python/gen_build_matrix.py --format=platformio-ini -o /tmp/generated_envs.ini
        diff generated_envs.ini /tmp/generated_envs.ini || {
          echo "::error::generated_envs.ini is out of date. Regenerate it with:"
          echo "::error::  python3 extras/python/gen_build_matrix.py --format=platformio-ini -o generated_envs.ini"
          exit 1
        }
  #
  # Job#2 - Build every example/test variant for every platform, upload binaries as artifacts
  #
  build:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles','**/platformio.ini') }}

    - name: Set up Python
      uses: actions/setup-python@v2

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Install PlatformIO dependencies
      run: |
        pio pkg install

    - name: Run PlatformIO
      run: |
        rm -rf /tmp/pio-build
        EXTRA_OPTS=()
        if [ -n "$PARTITIONS" ]; then
          EXTRA_OPTS+=(--project-option="board_build.partitions=$PARTITIONS")
        fi
        if [ -n "$EXTRA_LIB_DEPS" ]; then
          EXTRA_OPTS+=(--project-option="lib_deps=$EXTRA_LIB_DEPS")
        fi
        pio ci --lib="." --project-option="lib_ldf_mode=deep+" --project-option="lib_compat_mode=strict" "${EXTRA_OPTS[@]}" --board="$PIO_BOARD" --keep-build-dir --build-dir /tmp/pio-build
      env:
        PLATFORMIO_CI_SRC: ${{ matrix.source }}
        PLATFORMIO_BUILD_FLAGS: ${{ matrix.build_flags }}
        IOTSA_CONFIG_PROGRAM_NAME: ${{ matrix.name }}
        PIO_BOARD: ${{ matrix.pio_board }}
        PARTITIONS: ${{ matrix.partitions }}
        EXTRA_LIB_DEPS: ${{ matrix.extra_lib_deps }}

# For some reason the program name change isn't picked up by pio ci.
    - name: Copy build output
      run: |
        cp /tmp/pio-build/.pio/build/${{ matrix.pio_board }}/firmware.bin ${{ matrix.name }}.bin

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}.bin
        path: ${{ matrix.name }}.bin
  #
  # Job#3 - dispatch build event to dependent repositories
  #
  dispatch:
    if: ${{ github.event_name == 'push' && ( github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/') ) }}
    needs: build
    strategy:
      matrix:
        repo:
        - cwi-dis/iotsa433
        - cwi-dis/iotsaBLELed
        - cwi-dis/iotsaDMXLedstrip
        - cwi-dis/iotsaDMXSensor
        - cwi-dis/iotsaDisplayServer
        - cwi-dis/iotsaDoorOpener
        - cwi-dis/iotsaDoorbellButton
        - cwi-dis/iotsaDoorbellRinger
        - cwi-dis/iotsaGPIO
        - cwi-dis/iotsaMotorServer
        - cwi-dis/iotsaNeoClock
        - cwi-dis/iotsaOLEDServer
        - cwi-dis/iotsaRGBWSensor
        - cwi-dis/iotsaResponseTime
        - cwi-dis/iotsaSensor
        - cwi-dis/iotsaSmartMeter
        - cwi-dis/lissabon
    runs-on: ubuntu-latest
    env:
      iotsa_ref: ${{ github.sha }}
    steps:
    - name: Set iotsa_ref
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      run: |
        echo "iotsa_ref=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Repository Dispatch
      uses: peter-evans/repository-dispatch@v1
      with:
        token: ${{ secrets.REPO_ACCESS_TOKEN }}
        repository: ${{ matrix.repo }}
        event-type: rebuild
        # Note this always uses the SHA. It may be better to use github.ref if it is refs/tags/xxxxxx
        client-payload: '{"iotsa_ref" : "${{ env.iotsa_ref }}" }'
