# Created this action based on information found in:
# - <https://docs.platformio.org/en/latest/integration/ci/github-actions.html>
# - <https://docs.github.com/en/free-pro-team@latest/actions/quickstart>
#
# The build matrix itself is not hand-maintained here: it is generated from
# examples/*/iotsa-build.json, tests/*/iotsa-build.json, and sandbox/*/iotsa-build.json
# by extras/python/gen_build_matrix.py. See #156/#222.
name: build-platformio
on:
  push:
    branches:
    - develop
    - master
    tags:
    - '*'
    paths-ignore:
    - '.github/workflows/build-arduino.yml'
    - 'docs/**'
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
    - unlabeled
  workflow_dispatch:
    inputs:
      iotsa_ref:
        description: 'iotsa branch, ref or sha'
        required: true
        detault: develop

jobs:
  #
  # Job#1 - Compute the build matrix from examples/*/iotsa-build.json,
  # tests/*/iotsa-build.json, and sandbox/*/iotsa-build.json, and check the
  # committed generated_envs.ini (used for local dev builds) is still in sync
  # with the same source data.
  #
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7

    # See #216: full builds every example/test/sandbox entry, minimal is just the
    # tests/ and sandbox/ trees (#222) plus the handful of examples/ that cover
    # something neither does. Default
    # is full (a push to develop is the one deliberate exception); a PR only
    # drops to minimal if it carries the "ci-minimal" label.
    - name: Determine build tier
      id: tier
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
        HAS_MINIMAL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-minimal') }}
      run: |
        TIER=full
        if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/develop" ]; then
          TIER=minimal
        fi
        if [ "$EVENT_NAME" = "pull_request" ] && [ "$HAS_MINIMAL_LABEL" = "true" ]; then
          TIER=minimal
        fi
        echo "tier=$TIER" >> "$GITHUB_OUTPUT"
        echo "Build tier: $TIER"

    - name: Generate matrix
      id: gen
      run: |
        MATRIX=$(python3 extras/python/gen_build_matrix.py --format=github-matrix --backend=platformio --tier=${{ steps.tier.outputs.tier }})
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

    - name: Check generated files are up to date with iotsa-board.json / iotsa-build.json
      run: |
        python3 extras/python/gen_build_matrix.py --format=platformio-ini -o /tmp/generated_envs.ini
        diff generated_envs.ini /tmp/generated_envs.ini || {
          echo "::error::generated_envs.ini is out of date. Regenerate it with:"
          echo "::error::  python3 extras/python/gen_build_matrix.py --format=platformio-ini -o generated_envs.ini"
          exit 1
        }
        python3 extras/python/gen_build_matrix.py --format=board-defs-ini -o /tmp/iotsa-board-defs.ini
        # ignore the "; Generated <date> ..." line -- it's an informational vintage
        # marker for downstream vendored copies, not part of the staleness contract.
        diff <(grep -v '^; Generated ' iotsa-board-defs.ini) <(grep -v '^; Generated ' /tmp/iotsa-board-defs.ini) || {
          echo "::error::iotsa-board-defs.ini is out of date. Regenerate it with:"
          echo "::error::  python3 extras/python/gen_build_matrix.py --format=board-defs-ini -o iotsa-board-defs.ini"
          exit 1
        }
        python3 extras/python/gen_build_matrix.py --format=boards-md -o /tmp/boards.md
        diff docs/boards.md /tmp/boards.md || {
          echo "::error::docs/boards.md is out of date. Regenerate it with:"
          echo "::error::  python3 extras/python/gen_build_matrix.py --format=boards-md -o docs/boards.md"
          exit 1
        }
  #
  # Job#2 - Build every example/test variant for every platform, upload binaries as artifacts
  #
  build:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache PlatformIO
      uses: actions/cache@v6
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles','**/platformio.ini') }}

    - name: Set up Python
      uses: actions/setup-python@v7

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        # tool-esptoolpy (espressif32 platform) currently ships an esptool build that
        # imports intelhex for bootloader/partition-table generation without declaring
        # it as a dependency -- install it explicitly or every build fails at
        # "Generating partitions.bin" with ModuleNotFoundError: No module named
        # 'intelhex'. Upstream packaging gap, not an iotsa issue -- drop this once
        # tool-esptoolpy bundles/declares it itself.
        pip install intelhex

    - name: Install PlatformIO dependencies
      run: |
        pio pkg install

    - name: Run PlatformIO
      run: |
        rm -rf /tmp/pio-build
        EXTRA_OPTS=()
        if [ -n "$PARTITIONS" ]; then
          EXTRA_OPTS+=(--project-option="board_build.partitions=$PARTITIONS")
        fi
        if [ -n "$EXTRA_LIB_DEPS" ]; then
          EXTRA_OPTS+=(--project-option="lib_deps=$EXTRA_LIB_DEPS")
        fi
        pio ci --lib="." --project-option="lib_ldf_mode=deep+" --project-option="lib_compat_mode=strict" "${EXTRA_OPTS[@]}" --board="$PIO_BOARD" --keep-build-dir --build-dir /tmp/pio-build
      env:
        PLATFORMIO_CI_SRC: ${{ matrix.source }}
        PLATFORMIO_BUILD_FLAGS: ${{ matrix.build_flags }}
        IOTSA_CONFIG_PROGRAM_NAME: ${{ matrix.name }}
        PIO_BOARD: ${{ matrix.pio_board }}
        PARTITIONS: ${{ matrix.partitions }}
        EXTRA_LIB_DEPS: ${{ matrix.extra_lib_deps }}

# For some reason the program name change isn't picked up by pio ci.
    - name: Copy build output
      run: |
        cp /tmp/pio-build/.pio/build/${{ matrix.pio_board }}/firmware.bin ${{ matrix.name }}.bin

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.name }}.bin
        path: ${{ matrix.name }}.bin
  #
  # Job#3 - dispatch build event to dependent repositories
  #
  dispatch:
    # Re-enabled 2026-08-29: the v3 redesign (cwi-dis/iotsa#199)'s breaking changes
    # have accumulated on develop long enough to start the coordinated downstream
    # rollout for v3.0a1 -- see #199's "Downstream migration checklist". Every
    # dependent repo is expected to fail this dispatch until it's updated; that's
    # the point of tagging now, not a sign something's wrong here.
    #
    # Tag pushes only (releases, including alpha/beta) -- not develop pushes. Since
    # #216, a develop push only runs the minimal build tier, so it's no longer a
    # trustworthy trigger for "go rebuild against this iotsa commit"; downstream
    # repos should track tagged releases instead of every develop commit.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    strategy:
      matrix:
        repo:
        - cwi-dis/iotsa433
        - cwi-dis/iotsaDMXLedstrip
        - cwi-dis/iotsaDMXSensor
        - cwi-dis/iotsaDataLogger
        - cwi-dis/iotsaDisplayServer
        - cwi-dis/iotsaDoorOpener
        - cwi-dis/iotsaDoorbellButton
        - cwi-dis/iotsaDoorbellRinger
        - cwi-dis/iotsaEstimotes
        - cwi-dis/iotsaGPIO
        - cwi-dis/iotsaMotorServer
        - cwi-dis/iotsaNeoClock
        - cwi-dis/iotsaOLEDServer
        - cwi-dis/iotsaRGBWSensor
        - cwi-dis/iotsaResponseTime
        - cwi-dis/iotsaSmartMeter
        - cwi-dis/lissabon
    runs-on: ubuntu-latest
    env:
      iotsa_ref: ${{ github.sha }}
    steps:
    - name: Set iotsa_ref
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      run: |
        echo "iotsa_ref=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Repository Dispatch
      uses: peter-evans/repository-dispatch@v4
      with:
        token: ${{ secrets.REPO_ACCESS_TOKEN }}
        repository: ${{ matrix.repo }}
        event-type: rebuild
        # Note this always uses the SHA. It may be better to use github.ref if it is refs/tags/xxxxxx
        client-payload: '{"iotsa_ref" : "${{ env.iotsa_ref }}" }'
