# Created this action based on information found in:
# - <https://github.com/marketplace/actions/test-compile-for-arduino>
# - <https://docs.github.com/en/free-pro-team@latest/actions/quickstart>
#
# The build matrix itself is not hand-maintained here: it is generated from
# examples/*/iotsa-build.json and tests/*/iotsa-build.json by
# extras/python/gen_build_matrix.py. See #156.
name: build-arduino
on:
  push:
    paths-ignore:
    - '.github/workflows/build-platformio.yml'
    - 'docs/**'
  pull_request:
  workflow_dispatch:
    inputs:
      iotsa_ref:
        description: 'iotsa branch, ref or sha'
        required: true

jobs:
  #
  # Job#1 - Compute the build matrix from examples/*/iotsa-build.json and
  # tests/*/iotsa-build.json.
  #
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7

    - name: Generate matrix
      id: gen
      run: |
        MATRIX=$(python3 extras/python/gen_build_matrix.py --format=github-matrix --backend=arduino)
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
  #
  # Job#2 - Build every arduino-cli-enabled example/test variant
  #
  build:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache Arduino CLI
      uses: actions/cache@v6
      with:
        path: ~/.arduino15
        key: ${{ runner.os }}-arduino-${{ hashFiles('*_index.json') }}

    - name: Cache Arduino libraries
      uses: actions/cache@v6
      with:
        path: ~/Arduino/libraries
        key: ${{ runner.os }}-arduinolibs-${{ hashFiles('**/library.properties') }}

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2

    - name: Install pyserial
      run: |
        python -m pip install --upgrade pip
        pip install pyserial

    - name: Install Arduino platforms and libraries
      run: |
        arduino-cli core list --all
        arduino-cli config init --overwrite
        arduino-cli config set library.enable_unsafe_install true
        arduino-cli config add board_manager.additional_urls "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
        arduino-cli config add board_manager.additional_urls "https://arduino.esp8266.com/stable/package_esp8266com_index.json"
        arduino-cli core update-index
        arduino-cli core install "esp32:esp32"
        arduino-cli core install "esp8266:esp8266"
        arduino-cli core upgrade
        arduino-cli lib install "Adafruit NeoPixel"
        arduino-cli lib install "ArduinoJson"
        arduino-cli lib install "CoAP simple library"
        arduino-cli lib install "DHT sensor library"
        arduino-cli lib install "Adafruit Unified Sensor"
        arduino-cli lib install "Ds1302"
        arduino-cli lib install "ESP32Encoder"
        arduino-cli lib install "NimBLE-Arduino"
        arduino-cli lib install --git-url https://github.com/yutter/ArduinoJWT
        arduino-cli lib install --git-url https://github.com/jackjansen/esp32_idf5_https_server
        arduino-cli lib install --git-url https://github.com/jackjansen/esp32_idf5_https_server_compat

    - name: Install iotsa library
      run: |
        mkdir -p ~/Arduino/libraries
        ln -fs $PWD ~/Arduino/libraries/iotsa

    - name: Build ${{ matrix.name }}
      run: |
        BOARD_OPTS=()
        if [ -n "$PARTITION_SCHEME" ]; then
          BOARD_OPTS+=(--board-options "PartitionScheme=$PARTITION_SCHEME")
        fi
        BUILD_PROPS=()
        if [ -n "$BUILD_FLAGS" ]; then
          BUILD_PROPS+=(--build-property "compiler.cpp.extra_flags=$BUILD_FLAGS")
        fi
        arduino-cli compile --fqbn "$FQBN" "${BOARD_OPTS[@]}" "${BUILD_PROPS[@]}" "$SOURCE"
      env:
        FQBN: ${{ matrix.fqbn }}
        SOURCE: ${{ matrix.source }}
        BUILD_FLAGS: ${{ matrix.build_flags }}
        PARTITION_SCHEME: ${{ matrix.partition_scheme }}

    - name: Uninstall iotsa and custom libraries
      run: |
        rm -f ~/Arduino/libraries/iotsa
        ls -la ~/Arduino/libraries
