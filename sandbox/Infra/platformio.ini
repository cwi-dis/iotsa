; PlatformIO Project Configuration File
; Generated by extras/python/gen_build_matrix.py -- do not hand-edit,
; regenerate instead:
;   python3 extras/python/gen_build_matrix.py --format=standalone-ini \
;     --dir=sandbox/Infra -o sandbox/Infra/platformio.ini
; To pin this example against a specific published iotsa branch/tag
; instead of the local checkout, add an iotsa-config.json here:
;   {"iotsa": "https://github.com/cwi-dis/iotsa.git#develop"}
;
[platformio]
src_dir = .
default_envs = iotsa_v4

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps = symlink://../..
monitor_speed = 115200

[env:iotsa_v4]
extends = common
platform = espressif8266
board = nodemcuv2
build_flags = -DIOTSA_WITH_HTTPS -DIOTSA_WIFI_DEBUG
board_build.partitions = min_spiffs.csv

[env:esp32thing]
extends = common
platform = espressif32
board = esp32thing
build_flags = -DIOTSA_WITH_BLE -DIOTSA_WITH_HTTPS -DIOTSA_WIFI_DEBUG
board_build.partitions = min_spiffs.csv

[env:esp32c3devkit]
extends = common
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = -DESP32C3 -DIOTSA_PIN_NEOPIXEL=8 -DIOTSA_WITH_BLE -DIOTSA_WITH_HTTPS -DIOTSA_WIFI_DEBUG
board_build.partitions = min_spiffs.csv

[env:lolin32]
extends = common
platform = espressif32
board = lolin32_lite
build_flags = -DIOTSA_WITH_BLE -DIOTSA_WITH_HTTPS -DIOTSA_WIFI_DEBUG
board_build.partitions = min_spiffs.csv

