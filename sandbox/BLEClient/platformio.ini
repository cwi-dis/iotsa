; PlatformIO Project Configuration File
; Generated by extras/python/gen_build_matrix.py -- do not hand-edit,
; regenerate instead:
;   python3 extras/python/gen_build_matrix.py --format=standalone-ini \
;     --dir=sandbox/BLEClient -o sandbox/BLEClient/platformio.ini
; To pin this example against a specific published iotsa branch/tag
; instead of the local checkout, add an iotsa-config.json here:
;   {"iotsa": "https://github.com/cwi-dis/iotsa.git#develop"}
;
[platformio]
src_dir = .
default_envs = esp32thing

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps = symlink://../..
monitor_speed = 115200

[env:esp32thing]
extends = common
platform = espressif32
board = esp32thing
build_flags = -DIOTSA_WITH_BLE
board_build.partitions = min_spiffs.csv

[env:esp32c3devkit]
extends = common
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = -DIOTSA_WITH_BLE
board_build.partitions = min_spiffs.csv

[env:esp32s3supermini]
extends = common
platform = espressif32
board = esp32-s3-devkitc-1
build_flags = -DIOTSA_WITH_BLE
board_build.partitions = min_spiffs.csv

[env:lolin32]
extends = common
platform = espressif32
board = lolin32
build_flags = -DIOTSA_WITH_BLE -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192 -DIOTSA_DEBUG_BLE_PRINT_ALL_CLIENTS -DCONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT
board_build.partitions = min_spiffs.csv

[env:esp32thing-withble]
extends = common
platform = espressif32
board = esp32thing
build_flags = -DIOTSA_WITH_BLE
board_build.partitions = min_spiffs.csv

[env:esp32c3devkit-withble]
extends = common
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = -DIOTSA_WITH_BLE
board_build.partitions = min_spiffs.csv

[env:lolin32-coordinated]
extends = common
platform = espressif32
board = lolin32
build_flags = -DIOTSA_WITH_BLE -DIOTSA_DEBUG_BLE_PRINT_ALL_CLIENTS -DCOORDINATE_WITH_SERVER
board_build.partitions = min_spiffs.csv

