; Generated 2026-08-31 by extras/python/gen_build_matrix.py from iotsa-board.json --
; do not hand-edit, regenerate instead:
;   python3 extras/python/gen_build_matrix.py --format=board-defs-ini -o iotsa-board-defs.ini
;
; Vendored into an app repo? The date above is this copy's vintage -- once in
; a while, diff -c it against the current iotsa iotsa-board-defs.ini for
; relevant changes. Never edit a board section here downstream: put
; app-specific board choices in the app's own platformio.ini. A section here
; that isn't in iotsa's copy is the signal it still needs porting back.
;
; Layer 2 -- boards we actually use. See iotsa-board-traits.ini for layer 3.

[iotsa_v4]
extends = _esp8266
board = nodemcuv2

[esp32thing]
extends = _esp32_allvariants
board = esp32thing

[esp32dev]
extends = _esp32_allvariants
board = esp32dev

[lolin32]
extends = _esp32_allvariants
board = lolin32_lite
board_build.partitions = min_spiffs.csv

[lolin32_oled]
extends = _esp32_allvariants
board = lolin32_lite
board_build.partitions = min_spiffs.csv

[pico32]
extends = _esp32_allvariants
board = pico32

[esp32c3devkit]
extends = _esp32c3_extusb
board = esp32-c3-devkitm-1
build_flags = ${_esp32c3_extusb.build_flags} -DIOTSA_PIN_NEOPIXEL=8

[esp32c3lcd]
extends = _esp32c3_nativeusb
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.partitions = bare_minimum_2MB.csv
board_upload.flash_size = 2MB

[esp32c3supermini]
extends = _esp32c3_nativeusb
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB

[crowpanel128]
extends = _esp32c3_extusb
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB

[esp32s3supermini]
extends = _esp32s3_nativeusb
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
build_flags = ${_esp32s3_nativeusb.build_flags} -DIOTSA_PIN_NEOPIXEL=48

; Layer 1 -- vanilla_* role aliases, pure synonyms.

[vanilla_esp8266]
extends = iotsa_v4

[vanilla_esp32]
extends = esp32thing

[vanilla_esp32c3]
extends = esp32c3devkit

[vanilla_esp32s3]
extends = esp32s3supermini

