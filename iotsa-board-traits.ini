; Layer 3 -- processor/USB-wiring traits (#222). Hand-authored: these change
; rarely and carry real pio-specific syntax (multi-line lib_deps/lib_ignore)
; not worth generalizing into gen_build_matrix.py's data. Leading underscore:
; these are plumbing, never a valid iotsa-build.json "board" value on their
; own (no board=, no hardware facts like a neopixel pin).
;
; Kept in its own file (like iotsa-board-defs.ini, generated) so both can be vendored
; into iotsa-using repos without pulling in this repo's own [platformio]/[common]/
; [use_debug*] sections too -- see #222 (cross-repo board-def sharing is still open).
;
; IMPORTANT: each trait's build_flags is duplicated in gen_build_matrix.py's
; TRAIT_BUILD_FLAGS -- emit_github_matrix/emit_standalone_ini build outside any
; ini extends chain, so they can't inherit a trait's flags the way a local
; `pio run` build (via iotsa-board-defs.ini's `extends =`) does. Keep both in sync.
;
; extends = common: [common] lives in the toplevel platformio.ini, not here --
; that's fine, PlatformIO merges every extra_configs file into one namespace
; before resolving "extends". [common] must define build_flags (empty is fine):
; a trait that sets its own build_flags starts with ${common.build_flags}, or it
; would silently replace the app's common flags instead of adding to them.
;
[_esp8266]
extends = common
platform = espressif8266@4.0
# iotsa uses LittleFS (iotsaFS.h); PlatformIO's default for uploadfs is SPIFFS (#269).
board_build.filesystem = littlefs

[_esp32_allvariants]
extends = common
# Pinned: unpinned, PlatformIO picks the highest-numbered espressif32 installed on the
# machine, and community forks (pioarduino 51.x, Tasmota 2023.x) install under the
# same name -- every iotsa build silently switches to them (#269). Bump deliberately.
# Keep in sync with gen_build_matrix.py's FAMILY_PLATFORM.
platform = espressif32@7.1.3
# iotsa uses LittleFS (iotsaFS.h); PlatformIO's default for uploadfs is SPIFFS (#269).
board_build.filesystem = littlefs
lib_deps =
    ${common.lib_deps}
    jackjansen/esp32_idf5_https_server_compat
    h2zero/NimBLE-Arduino@^2.1.0
    madhephaestus/ESP32Encoder

lib_ignore =
    ESP32 BLE Arduino
# HPS PUT handlers run on the NimBLE host task and overflow its default 4096-byte
# stack (#127). Must be a build-wide flag: NimBLE's own sources never see iotsa
# headers. Unconditional: the task only exists in BLE builds anyway.
build_flags = ${common.build_flags} -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

[_esp32c3_extusb]
extends = _esp32_allvariants
# For esp32c3 boards with an external USB-serial interface chip.
build_flags = ${_esp32_allvariants.build_flags} -DESP32C3

[_esp32c3_nativeusb]
extends = _esp32_allvariants
# This enables the builtin esp32c3 USB-Serial/JTAG peripheral to be used as Serial.
# IOTSA_DELAY_ON_BOOT gives the host time to open the CDC port before the first
# prints happen, so early boot output isn't lost -- needed by any native-USB
# board, not just esp32c3, hence it lives here rather than in the ESP32C3-only
# [_esp32c3_extusb] (external-interface) trait above.
build_flags = ${_esp32_allvariants.build_flags} -DESP32C3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DIOTSA_SERIAL_SPEED=460800 -DIOTSA_DELAY_ON_BOOT=3

[_esp32s3_nativeusb]
extends = _esp32_allvariants
# This enables the builtin esp32s3 USB-Serial/JTAG peripheral to be used as Serial.
# esp32s3otg (the alternative native USB-OTG/TinyUSB peripheral) is not defined yet.
# See _esp32c3_nativeusb above for why IOTSA_DELAY_ON_BOOT belongs here. -DESP32S3
# mirrors -DESP32C3 above -- iotsa#222 named this exact asymmetry (nobody had ever
# added the S3 equivalent) as an example of the board-section inconsistencies to fix.
build_flags = ${_esp32_allvariants.build_flags} -DESP32S3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DIOTSA_SERIAL_SPEED=460800 -DIOTSA_DELAY_ON_BOOT=3
